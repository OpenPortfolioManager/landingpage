# Builds the static site and publishes it to GitHub Pages on every push to main.
# For a custom domain set the repository variables SITE_URL (e.g. https://example.pl) and BASE_PATH (/),
# then point the domain at GitHub Pages; canonical, hreflang and sitemap URLs follow automatically.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_URL: ${{ vars.SITE_URL || 'https://p14s3k.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/landingpage' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
